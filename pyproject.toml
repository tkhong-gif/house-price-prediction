[project]
name = "let-me-have-a-house"
version = "0.1.0"
description = "Estimate Mecklenburg County home assessed values from house, area and accessibility features"
readme = "README.md"
authors = [
    { name = "Tam Khong", email = "tkhong@charlotte.edu" },
    { name = "Eric Toan", email = "ntoan@charlotte.edu" },
    { name = "Eric Toan", email = "ngdtoan58@gmail.com" },
    { name = "Ethan Wan", email = "ewan@charlotte.edu" },
]
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.1.4",
    "numpy>=2.5.2",
    "overturemaps>=1.0.2",
    "pandas",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
# Only needed if "xgboost" is added back to training.MODEL_TYPES: uv sync --extra xgboost
xgboost = ["xgboost>=3.4.1"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "pytest>=9.2.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
