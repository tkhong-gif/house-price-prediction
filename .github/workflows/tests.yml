name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
      - name: Run the get-started demo
        run: |
          uv run python bin/quick_train.py
          uv run python bin/predict_example.py --demo
